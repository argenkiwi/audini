name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Read Package Version
        id: package_version
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if Release Exists
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.package_version.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.check_release.outputs.exists == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Extension Bundle
        if: steps.check_release.outputs.exists == 'false'
        run: |
          yarn install
          yarn build

      - name: Package Extension Zip
        if: steps.check_release.outputs.exists == 'false'
        run: |
          zip -r audini-v${{ steps.package_version.outputs.version }}.zip manifest.json player.html player.css player.bundle.js popup.html popup.css popup.js background.js content.js images/

      - name: Create GitHub Release & Tag
        if: steps.check_release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.package_version.outputs.version }}"
          gh release create "$TAG" audini-v${{ steps.package_version.outputs.version }}.zip \
            --title "Release $TAG" \
            --generate-notes
